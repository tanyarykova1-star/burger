<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgers - Доставка сочных бургеров</title>

    <!-- СТИЛИ CSS (ВСЁ В ОДНОМ ФАЙЛЕ) -->
    <style>
        /* Обнуление стандартных отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #191411; /* Темный стильный фон из макета Айтилогии */
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Контейнер, чтобы сайт не растягивался во всю ширину экрана */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- ШАПКА САЙТА (HEADER) --- */
        .header {
            padding: 30px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between; /* Логотип слева, меню справа */
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo img {
            width: 40px;
            height: auto;
        }

        .menu a {
            text-decoration: none;
            color: #ffffff;
            margin-left: 40px;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: #ffc400; /* Желтый акцентный цвет при наведении */
        }

        /* --- ГЛАВНЫЙ БЛОК (MAIN) --- */
        .main-block {
            padding: 70px 0 100px 0;
        }

        .main-content {
            display: flex;
            justify-content: space-between; /* Текст слева, бургер справа */
            align-items: center;
            gap: 50px;
        }

        .main-info {
            max-width: 550px;
        }

        .main-tag {
            display: inline-block;
            background-color: #ffc400;
            color: #191411;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .main-title {
            font-size: 58px;
            line-height: 1.15;
            font-weight: 900;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .main-title span {
            color: #ffc400; /* Выделяем слово цветом */
        }

        .main-text {
            font-size: 18px;
            line-height: 1.6;
            color: #bfbfbf;
            margin-bottom: 45px;
        }

        /* КНОПКА ЗАКАЗА */
        .btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: #ffc400;
            color: #191411;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 196, 0, 0.3);
        }

        .btn:hover {
            background-color: #e6b200;
            transform: translateY(-2px); /* Кнопка слегка приподнимается */
            box-shadow: 0 6px 25px rgba(255, 196, 0, 0.4);
        }

        /* ИЗОБРАЖЕНИЕ БУРГЕРА */
        .main-image {
            position: relative;
        }

        .main-image img {
            max-width: 100%;
            width: 500px;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5)); /* Тень под бургером */
        }
    </style>
</head>
<body>

    <!-- ШАПКА САЙТА -->
    <header class="header">
        <div class="container header-content">
            <!-- Логотип с иконкой бургера -->
            <div class="logo">
                <img src="https://flaticon.com" alt="Burger Logo">
                BURGERS
            </div>
            <!-- Навигация -->
            <nav class="menu">
                <a href="#">Главная</a>
                <a href="#">Почему мы?</a>
                <a href="#">Наше меню</a>
                <a href="#">Оформить заказ</a>
            </nav>
        </div>
    </header>

    <!-- ГЛАВНЫЙ БЛОК -->
    <main class="main-block">
        <div class="container main-content">
            
            <!-- Левая текстовая часть -->
            <div class="main-info">
                <span class="main-tag">Новое меню</span>
                <h1 class="main-title">Самые сочные <span>бургеры</span> в твоем городе!</h1>
                <p class="main-text">Мы готовим исключительно из свежего мраморного мяса блэк ангус, используем авторские соусы и выпекаем пышные булочки прямо перед подачей.</p>
                <button class="btn">Перейти в меню</button>
            </div>
            
            <!-- Правая часть с аппетитным бургером -->
            <div class="main-image">
                <img src="https://pngff.com" alt="Большой сочный бургер">
            </div>

        </div>
    </main>

</body>
</html>
